# Slack app manifest for the rate-limit alerts (M9).
# Create the app at https://api.slack.com/apps -> Create New App -> From a manifest,
# pick YOUR DEV WORKSPACE, paste this file, and replace YOUR-NGROK-DOMAIN with
# NGROK_DOMAIN from .env (add the production URL here too when deploying, M13).
display_information:
  name: ReachInbox Scheduler
  description: DMs you when one of your senders hits its hourly sending limit.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: ReachInbox Alerts
    always_online: false
oauth_config:
  redirect_urls:
    - https://YOUR-NGROK-DOMAIN/api/slack/callback
  scopes:
    bot:
      - chat:write # post the alert
      - im:write # open a DM with the user who connected Slack
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
